services:
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/data

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - API_PROXY_TARGET=http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_data:
